# What finalization hands over beyond SPEC.md. Each deliverable names the
# sections that feed it: a drill on a feeding section is told what the
# deliverable needs from it (`section guidance`) — a floor, not a ceiling —
# and finalize writes the file once every feeding section is agreed/locked.
# /spec-new re-verifies this list per project (drop, add, rename).
deliverables:
  - id: operator-guide
    title: Operator guide
    format: markdown guide
    path: operator-guide.md
    description: >-
      Step-by-step handbook for the human operating the deployment: provision
      an environment from scratch, promote a change, upgrade and roll back,
      rotate a secret, grant and review access, decommission — plus one
      recovery procedure per known failure mode, reachable from its alert.
      Written for a person on call, assuming the spec is not open beside them.
    sections:
      - topology
      - environments
      - access.permissions
      - secrets
      - config-management
      - lifecycle.provisioning
      - lifecycle.upgrades
      - lifecycle.rollback
      - lifecycle.decommission
      - observability.alerting
      - runbook
  - id: terraform-blueprint
    title: Infrastructure-as-code blueprint
    format: markdown brief for Terraform generation
    path: terraform-blueprint.md
    description: >-
      Everything needed to generate the Terraform (or equivalent) without
      re-reading the spec: resource inventory per environment, module
      boundaries, variables with their per-environment values, network and
      IAM bindings, secret references, state backend, and the manual steps
      that deliberately stay outside IaC.
    sections:
      - topology
      - infra-dependencies
      - environments
      - networking
      - access.identity
      - secrets
      - config-management
      - state
      - lifecycle.provisioning
  - id: architecture-diagram
    title: Architecture diagram
    format: mermaid diagram with legend and narrative
    path: architecture-diagram.md
    description: >-
      One scheme of the deployed system: platform components and where each
      runs, backing infrastructure, network boundaries and ingress, state
      stores, and every integrated system with the direction of each
      connection. A legend and a short walk-through of one run/job under the
      diagram.
    sections:
      - topology
      - infra-dependencies
      - networking
      - integrations.systems
      - state
  - id: integration-register
    title: Integration and access register
    format: markdown tables
    path: integration-register.md
    description: >-
      The tabular truth of who and what connects: each integrated system with
      endpoint, direction, auth method, credential location and owner; each
      platform role with the IdP groups mapped to it and what it may do.
    sections:
      - access.identity
      - access.permissions
      - integrations.conventions
      - integrations.systems
      - secrets
